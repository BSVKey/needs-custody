<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field App · Needs Custody</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E7C86">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C86'/%3E%3Cpath d='M16 6c4 5 7 9 7 13a7 7 0 0 1-14 0c0-4 3-8 7-13z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=1">
<link rel="stylesheet" href="/pilot/pilot.css?v=4">
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/pilot/app/">Needs Custody <span>· Field app</span></a></div></header>
<main class="wrap app">
  <section id="none" class="panel" hidden>
    <h1>This phone isn't set up yet</h1>
    <p class="lede small">Ask your pilot owner for an invite and scan its QR code with this phone.</p>
  </section>
  <section id="main" class="panel" hidden>
    <div class="who">
      <div><p class="eyebrow" id="site-name"></p><h1 id="who-name"></h1><p class="fine" id="who-role"></p></div>
      <select id="switch" hidden aria-label="Switch person"></select>
    </div>
    <div class="sync"><span id="dot" class="dot"></span><span id="sync-text">Checking...</span><button id="send" class="btn ghost small-btn" type="button">Send now</button></div>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="forms"></div>
    <h2 class="recent-head">Recorded on this phone</h2>
    <ul id="recent" class="recent"></ul>
  </section>
</main>
<script src="/pilot/lib.js?v=2"></script>
<script src="/pilot/app/app.js?v=1"></script>
</body>
</html>
